<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Listino — ListinoRapido</title>
  <meta name="theme-color" content="#020617">
  <!-- Percorsi assoluti: questa pagina viene servita anche su /s/nome-attivita (vedi vercel.json) -->
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/tailwind.css">
</head>
<body class="bg-slate-950 text-slate-300 antialiased">

  <!-- Solo il listino: è la pagina che si apre quando il cliente inquadra il QR code -->
  <div class="relative mx-auto h-[100dvh] max-w-md border-x border-slate-900">
    <div id="langs" class="absolute right-3 top-3 z-20 hidden gap-1.5" role="group" aria-label="Lingua"></div>
    <main id="menu" class="h-full overflow-y-auto" style="scrollbar-width:none"></main>
    <p id="msg" class="absolute inset-0 grid place-items-center bg-slate-950 p-8 text-center text-slate-400" role="status">Caricamento…</p>
  </div>

  <!-- Segnalazione del listino (solo listini reali) -->
  <div id="rep-modal" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-950/80 p-4 sm:items-center" role="dialog" aria-modal="true" aria-labelledby="rep-title">
    <form id="rep-form" class="w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-2xl" novalidate>
      <h2 id="rep-title" class="font-display text-lg font-bold text-white">Segnala questo listino</h2>
      <p class="mt-1 text-xs text-slate-400">Se contiene qualcosa di illegale, per adulti o ingannevole, dicci di cosa si tratta: lo controlliamo.</p>
      <label for="rep-reason" class="mt-4 block text-xs text-slate-400">Motivo</label>
      <select id="rep-reason" class="mt-1 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">
        <option value="illegal">Contenuti o servizi illegali</option>
        <option value="adult">Contenuti per adulti</option>
        <option value="scam">Truffa o contenuto ingannevole</option>
        <option value="rights">Violazione di diritti (immagini, marchi)</option>
        <option value="other">Altro</option>
      </select>
      <label for="rep-details" class="mt-3 block text-xs text-slate-400">Dettagli (facoltativo)</label>
      <textarea id="rep-details" rows="3" maxlength="1000" class="mt-1 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white"></textarea>
      <label for="rep-email" class="mt-3 block text-xs text-slate-400">La tua email (facoltativa, se vuoi una risposta)</label>
      <input id="rep-email" type="email" maxlength="160" autocomplete="email" class="mt-1 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white">
      <input id="rep-website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="absolute -left-[9999px] h-0 w-0 opacity-0">
      <p id="rep-msg" class="mt-3 hidden text-xs" role="status"></p>
      <div class="mt-4 flex justify-end gap-2">
        <button id="rep-cancel" type="button" class="rounded-xl border border-slate-700 px-4 py-2 text-sm text-slate-300 hover:bg-slate-800">Chiudi</button>
        <button id="rep-send" type="submit" class="rounded-xl bg-emerald-500 px-4 py-2 text-sm font-bold text-slate-950 hover:bg-emerald-400 disabled:opacity-50">Invia segnalazione</button>
      </div>
    </form>
  </div>

  <script src="/assets/config.js?v=2"></script>
  <script src="/assets/vendor/supabase.js"></script>
  <script src="/assets/data.js"></script>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      const qs = new URLSearchParams(location.search);
      const m = location.pathname.match(/^\/(?:s\/)?([a-z0-9][a-z0-9-]{1,38}[a-z0-9])\/?$/);          // /<link> oppure /s/<link>
      const slug = m && m[1] !== 'listino' ? m[1] : qs.get('s');
      const cfg = window.LR_CONFIG || {};
      const live = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase);
      const configured = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);
      const sb = live ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
      const show = (t) => { $('msg').textContent = t; $('msg').classList.remove('hidden'); };

      let data, pro = false, theme = '', venueId = null, lang = 'it';

      try {
        if (slug) {
          // Listino reale: letto da Supabase (policy RLS: lettura pubblica)
          if (!live) return show(configured ? 'Impossibile caricare il listino. Ricarica la pagina.' : 'Listino non disponibile.');
          const { data: v, error } = await sb.from('venues')
            .select('*').eq('slug', slug).maybeSingle();
          if (error) throw error;
          if (!v) return show('Questo listino non esiste o è stato rimosso.');
          const [c, s] = await Promise.all([
            sb.from('categories').select('id,name,name_i18n,position').eq('venue_id', v.id).order('position'),
            sb.from('services').select('*').eq('venue_id', v.id).eq('visible', true).order('position')
          ]);
          if (c.error) throw c.error;
          if (s.error) throw s.error;
          data = {
            business: { name: v.name, tagline: { it: v.tagline || '' }, whatsapp: v.whatsapp || '', about: v.about || '', address: v.address || '', phone: v.phone || '', instagram: v.instagram || '', hours: v.hours || [], cover: v.cover_url || '' },
            categories: c.data.map((x) => ({
              id: x.id,
              name: Object.assign({}, x.name_i18n, { it: x.name }),
              items: s.data.filter((y) => y.category_id === x.id).map((y) => ({
                id: y.id,
                name: Object.assign({}, y.name_i18n, { it: y.name }),
                desc: Object.assign({}, y.description_i18n, { it: y.description || '' }),
                price: y.price_cents / 100, min: y.duration_min || 0, img: y.image_url || '',
                oldPrice: y.old_price_cents ? y.old_price_cents / 100 : null, badge: y.badge || '', promoUntil: y.promo_until || ''
              }))
            }))
          };
          pro = v.plan === 'pro';
          theme = v.theme || '';
          venueId = v.id;
        } else {
          // Nessun link: listino di esempio (?demo=pro per la versione Professionale)
          pro = qs.get('demo') === 'pro';
          data = pro ? LR.DATA : LR.freeData();
          theme = qs.get('tema') || '';                     // anteprima palette: ?demo=pro&tema=rose|gold|ocean
        }
      } catch (e) {
        return show('Impossibile caricare il listino. Riprova tra poco.');
      }

      // Statistiche (PRO): una visita per sessione + click sul tasto WhatsApp
      const track = (kind, serviceId) => {
        if (!venueId) return;
        sb.from('page_views').insert({ venue_id: venueId, kind, service_id: serviceId || null }).then(() => {}, () => {});
      };
      try {
        if (!sessionStorage.getItem('lr_v_' + venueId)) { sessionStorage.setItem('lr_v_' + venueId, '1'); track('view'); }
      } catch (e) { track('view'); }

      const el = $('menu');
      let opened = false;                    // la scheda del servizio si apre solo la prima volta
      const draw = () => {
        const keep = el.scrollTop;
        LR.renderListino(el, { pro, theme, lang, data, openService: opened ? null : qs.get('servizio'), onView: (id) => track('whatsapp_click', id) });
        if (venueId) {                                   // link di segnalazione in fondo (solo listini reali)
          const r = document.createElement('p');
          r.className = 'px-4 pb-8 pt-2 text-center text-[11px] text-slate-500';
          r.innerHTML = '<button type="button" id="rep-open" class="underline hover:text-slate-300">Segnala questo listino</button>';
          el.appendChild(r);
        }
        opened = true;
        el.scrollTop = keep;
      };

      // Segnalazione: invia un'email all'amministratore tramite /api/report
      const rep = $('rep-modal'), repMsg = (t, ok) => { const m = $('rep-msg'); m.textContent = t; m.className = 'mt-3 text-xs ' + (ok ? 'text-emerald-400' : 'text-red-300'); };
      const repClose = () => { rep.classList.add('hidden'); rep.classList.remove('flex'); };
      el.addEventListener('click', (e) => { if (!e.target.closest('#rep-open')) return; $('rep-msg').className = 'hidden'; $('rep-send').disabled = false; rep.classList.remove('hidden'); rep.classList.add('flex'); $('rep-reason').focus(); });
      $('rep-cancel').addEventListener('click', repClose);
      rep.addEventListener('click', (e) => { if (e.target === rep) repClose(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') repClose(); });
      $('rep-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('rep-send').disabled = true;
        try {
          const r = await fetch('/api/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug, reason: $('rep-reason').value, details: $('rep-details').value, email: $('rep-email').value, website: $('rep-website').value }) });
          if (r.status === 429) { repMsg('Hai già inviato diverse segnalazioni: riprova più tardi.'); $('rep-send').disabled = false; return; }
          if (!r.ok) throw new Error(r.status);
          repMsg('Grazie, la segnalazione è stata inviata.', true); $('rep-details').value = '';
          setTimeout(repClose, 1800);
        } catch (x) { repMsg('Invio non riuscito. Scrivi a info@listinorapido.it indicando il link del listino.'); $('rep-send').disabled = false; }
      });

      if (pro && LR.THEMES[theme]) document.documentElement.dataset.theme = theme;   // colora anche lo sfondo ai lati e il messaggio
      document.title = data.business.name + ' — Listino';
      draw();
      $('msg').classList.add('hidden');

      // Cambio lingua (solo PRO)
      if (pro) {
        const box = $('langs');
        box.innerHTML = ['it', 'en', 'fr'].map((l) =>
          `<button data-l="${l}" class="rounded-full border px-2.5 py-1 text-[11px] font-semibold uppercase backdrop-blur ${l === lang ? 'border-emerald-500 bg-emerald-500 text-slate-950' : 'border-slate-700 bg-slate-950/80 text-slate-200'}">${l}</button>`).join('');
        box.classList.remove('hidden'); box.classList.add('flex');
        box.addEventListener('click', (e) => {
          const b = e.target.closest('[data-l]'); if (!b) return;
          lang = b.dataset.l;
          box.querySelectorAll('button').forEach((x) => {
            const on = x === b;
            x.className = `rounded-full border px-2.5 py-1 text-[11px] font-semibold uppercase backdrop-blur ${on ? 'border-emerald-500 bg-emerald-500 text-slate-950' : 'border-slate-700 bg-slate-950/80 text-slate-200'}`;
          });
          draw();
        });
      }
    })();
  </script>
</body>
</html>
